<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login | Cyber Rats</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="login-page">

<div class="top-bar">
    <a href="{{ url_for('home') }}" class="back-btn">← Voltar ao início</a>
</div>

<div class="login-container">

    <div class="login-left"></div>

    <div class="login-right">
        <div class="login-card">

            <div class="login-logo">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Cyber Rats">
            </div>

            <form method="POST" action="{{ url_for('login') }}">

                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" name="email" placeholder="seu@email.com" required>
                </div>

                <div class="form-group">
                    <label>Senha</label>
                    <div class="password-wrapper">
                        <input type="password" name="senha" id="senha" placeholder="••••••••" required>
                        <span class="toggle-password" onclick="toggleSenha()">👁</span>
                    </div>
                </div>

                <div class="login-links">
                    <a href="#">Esqueci minha senha</a>
                </div>

                <button type="submit" class="btn-login">Acessar</button>

                <p class="register-link">
                    <span>Não tem conta?</span>
                    <a href="{{ url_for('register') }}" class="link-highlight">Cadastre-se</a>
                </p>

            </form>

        </div>
    </div>

</div>

<script>
function toggleSenha() {
    const input = document.getElementById("senha");
    input.type = input.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
