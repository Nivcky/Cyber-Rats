<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro | Cyber Rats</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="header">
    <div class="container">
        <h2>Cadastre-se</h2>
        <a href="{{ url_for('home') }}" class="btn">Voltar ao início</a>
    </div>
</header>

<section class="form-section">
    <div class="form-container">

        <h2>Solicite contato com um especialista</h2>

        <form action="{{ url_for('register') }}" method="post"></form>

            <div class="form-group">
                <label>Nome</label>
                <input type="text" placeholder="Seu nome" required>
            </div>

            <div class="form-group">
                <label>Sobrenome</label>
                <input type="text" placeholder="Seu sobrenome" required>
            </div>

            <div class="form-group">
                <label>Empresa</label>
                <input type="text" placeholder="Nome da empresa" required>
            </div>

            <div class="form-group">
                <label>Telefone</label>
                <input type="tel" placeholder="(11) 99999-9999" required>
            </div>

            <div class="form-group">
                <label>Selecione sua área</label>
                <select required>
                    <option value="">-- Selecionar --</option>
                    <option>TI</option>
                    <option>Segurança da Informação</option>
                    <option>Financeiro</option>
                    <option>RH</option>
                    <option>Operações</option>
                </select>
            </div>

            <div class="form-group">
                <label>Cargo</label>
                <input type="text" placeholder="Seu cargo na empresa" required>
            </div>

            <div class="form-group">
                <label>E-mail corporativo</label>
                <input type="email" placeholder="seuemail@empresa.com" required>
            </div>

            <div class="form-group">
                <label>Comente sua demanda</label>
                <textarea rows="4" placeholder="Descreva sua necessidade"></textarea>
            </div>

            <div class="form-group">
                <label>Em quais áreas podemos te ajudar?</label>
                <select required>
                    <option value="">-- Selecionar --</option>
                    <option>Proteção contra ataques</option>
                    <option>Monitoramento de ameaças</option>
                    <option>Consultoria em segurança</option>
                    <option>Conformidade e LGPD</option>
                </select>
            </div>

            <button type="submit" class="btn">Enviar</button>

        </form>

        <p class="privacy-text">
            Para obter mais informações sobre como tratamos os seus dados pessoais, consulte a nossa Política de Tratamento de Dados e Aviso de Privacidade do Site Cyber Rats.
        </p>

    </div>
</section>

</body>
</html>
